<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordHop - Guess the Word!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5;
    --cloud: #FFFFFF;
    --grass: #4CAF50;
    --sun: #FFD600;
    --pink: #FF6B9D;
    --purple: #9B59B6;
    --orange: #FF8C42;
    --red: #E74C3C;
    --blue: #3498DB;
    --teal: #1ABC9C;
    --yellow: #F1C40F;
    --dark: #2C3E50;
    --mid: #566573;
    --light-bg: #F0F8FF;
    --card-bg: #FFFFFF;
    --letter-bg: #EBF5FB;
    --letter-border: #AED6F1;
    --correct: #27AE60;
    --wrong: #E74C3C;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #90EE90 40%, #4CAF50 100%);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ---- SCREENS ---- */
  .screen { display:none; width:100%; min-height:100vh; min-height:100dvh; }
  .screen.active { display:flex; flex-direction:column; }

  /* ---- HOME SCREEN ---- */
  #home {
    align-items:center;
    justify-content:center;
    padding: 20px;
    gap: 16px;
    position:relative;
    overflow:hidden;
  }

  .sun-decoration {
    position:absolute; top:-10px; right:-10px;
    width:100px; height:100px;
    background:#FFD600;
    border-radius:50%;
    box-shadow: 0 0 0 12px rgba(255,214,0,0.3), 0 0 0 24px rgba(255,214,0,0.15);
  }

  .cloud {
    position:absolute;
    background:white;
    border-radius:50px;
    opacity:0.85;
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute;
    background:white; border-radius:50%;
  }
  .cloud-1 { width:80px; height:30px; top:60px; left:10px; }
  .cloud-1::before { width:40px; height:40px; top:-20px; left:10px; }
  .cloud-1::after { width:30px; height:30px; top:-14px; left:35px; }
  .cloud-2 { width:100px; height:35px; top:30px; right:20px; }
  .cloud-2::before { width:50px; height:50px; top:-25px; left:15px; }
  .cloud-2::after { width:40px; height:40px; top:-20px; left:45px; }

  .game-logo {
    font-family:'Fredoka One', cursive;
    font-size: 52px;
    color: white;
    text-shadow: 4px 4px 0 #FF6B9D, 6px 6px 0 rgba(0,0,0,0.2);
    letter-spacing: 2px;
    margin-top:20px;
    position:relative;
  }
  .logo-sub {
    font-size:14px;
    font-weight:700;
    color:rgba(255,255,255,0.9);
    text-align:center;
    text-shadow:1px 1px 0 rgba(0,0,0,0.2);
    margin-top:-8px;
  }

  .kangaroo-home {
    font-size: 90px;
    margin: 8px 0;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
    animation: bounce-home 2s ease-in-out infinite;
  }
  @keyframes bounce-home {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-14px);}
  }

  .category-grid {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    width:100%;
    max-width:380px;
  }

  .cat-btn {
    background:white;
    border:none;
    border-radius:16px;
    padding:14px 10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    transition: transform 0.12s, box-shadow 0.12s;
    position:relative;
    overflow:hidden;
  }
  .cat-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.1); }

  .cat-btn .cat-icon { font-size:30px; }
  .cat-btn .cat-name { font-size:12px; font-weight:800; color:#2C3E50; text-align:center; line-height:1.2; }
  .cat-btn .cat-count { font-size:10px; color:#95A5A6; font-weight:600; }

  .cat-btn.words { background:linear-gradient(135deg,#EBF5FB,#D6EAF8); }
  .cat-btn.songs { background:linear-gradient(135deg,#FEF9E7,#FCF3CF); }
  .cat-btn.countries { background:linear-gradient(135deg,#E8F8F5,#D1F2EB); }
  .cat-btn.capitals { background:linear-gradient(135deg,#F4ECF7,#E8DAEF); }
  .cat-btn.cars { background:linear-gradient(135deg,#FDEDEC,#FADBD8); }
  .cat-btn.events { background:linear-gradient(135deg,#FEF5E7,#FDEBD0); }
  .cat-btn.people { background:linear-gradient(135deg,#EAFAF1,#D5F5E3); }
  .cat-btn.phrases { background:linear-gradient(135deg,#EBF5FB,#D2E9FC); }

  .start-all-btn {
    background:linear-gradient(135deg,#FF6B9D,#FF4757);
    color:white;
    border:none;
    border-radius:18px;
    padding:16px 40px;
    font-family:'Fredoka One',cursive;
    font-size:22px;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,0.15);
    transition:transform 0.12s, box-shadow 0.12s;
    width:100%;
    max-width:380px;
  }
  .start-all-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,0.15);}

  /* ---- GAME SCREEN ---- */
  #game {
    flex-direction:column;
    align-items:center;
    padding:0;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 35%, #90EE90 35%, #4CAF50 100%);
  }

  .game-header {
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(4px);
  }

  .back-btn {
    background:white;
    border:none;
    border-radius:12px;
    padding:8px 14px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:14px;
    color:#2C3E50;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.1);
  }

  .score-area {
    display:flex;
    gap:8px;
    align-items:center;
  }

  .score-badge {
    background:white;
    border-radius:12px;
    padding:6px 12px;
    font-weight:800;
    font-size:13px;
    color:#2C3E50;
    box-shadow:0 3px 0 rgba(0,0,0,0.1);
  }
  .score-badge span { color:#FF6B9D; font-size:15px; }

  .category-tag {
    background:rgba(255,255,255,0.9);
    border-radius:10px;
    padding:4px 10px;
    font-size:11px;
    font-weight:800;
    color:#6C3483;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  /* HOUSE SCENE */
  .house-area {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:4px 0 0;
  }

  .house-svg {
    width:200px;
    height:150px;
  }

  .tries-label {
    font-size:12px;
    font-weight:800;
    color:rgba(255,255,255,0.9);
    text-shadow:1px 1px 0 rgba(0,0,0,0.2);
    margin-top:2px;
  }

  .speech-bubble {
    background:white;
    border-radius:16px;
    padding:6px 14px;
    font-size:12px;
    font-weight:700;
    color:#2C3E50;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    margin-top:4px;
    display:none;
    align-self:center;
  }
  .speech-bubble.visible { display:block; }

  /* WORD DISPLAY */
  .word-display-area {
    width:100%;
    padding:10px 12px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .word-row {
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    max-width:360px;
  }

  .letter-box {
    width:28px;
    height:32px;
    background:white;
    border-radius:8px;
    border:2.5px solid #AED6F1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka One',cursive;
    font-size:18px;
    color:#2C3E50;
    box-shadow:0 3px 0 #AED6F1;
    transition: all 0.25s;
    position:relative;
  }
  .letter-box.space-gap {
    width:10px;
    background:transparent;
    border:none;
    box-shadow:none;
  }
  .letter-box.revealed {
    background:#EAFAF1;
    border-color:#27AE60;
    box-shadow:0 3px 0 #1E8449;
    color:#1A5276;
    animation: pop-letter 0.3s ease;
  }
  .letter-box.wrong-letter {
    animation: shake-box 0.3s ease;
  }
  @keyframes pop-letter {
    0%{transform:scale(1.4);} 100%{transform:scale(1);}
  }
  @keyframes shake-box {
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  /* HINT AREA */
  .hint-section {
    width:100%;
    max-width:360px;
    padding:4px 16px 0;
  }
  .hint-btn {
    background:linear-gradient(135deg,#F39C12,#E67E22);
    color:white;
    border:none;
    border-radius:12px;
    padding:8px 20px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:6px;
    transition:transform 0.12s;
  }
  .hint-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.15);}
  .hint-btn:disabled{background:#BDC3C7;cursor:default;box-shadow:none;}
  .hint-text {
    font-size:12px;
    font-weight:700;
    color:#6C3483;
    background:#F4ECF7;
    border-radius:10px;
    padding:6px 12px;
    margin-top:4px;
    line-height:1.4;
  }

  /* WRONG LETTERS */
  .wrong-letters-area {
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    justify-content:center;
    padding:4px 16px;
    max-width:360px;
    width:100%;
  }
  .wrong-letter-chip {
    background:#FADBD8;
    border:2px solid #E74C3C;
    border-radius:8px;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka One',cursive;
    font-size:14px;
    color:#C0392B;
    animation: pop-wrong 0.25s ease;
  }
  @keyframes pop-wrong {
    0%{transform:scale(1.3);}100%{transform:scale(1);}
  }

  /* KEYBOARD */
  .keyboard-area {
    width:100%;
    max-width:400px;
    padding:8px 8px 12px;
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-top:auto;
  }
  .key-row {
    display:flex;
    gap:4px;
    justify-content:center;
  }
  .key {
    flex:1;
    max-width:34px;
    height:44px;
    background:white;
    border:none;
    border-radius:10px;
    font-family:'Fredoka One',cursive;
    font-size:16px;
    color:#2C3E50;
    cursor:pointer;
    box-shadow:0 3px 0 #BDC3C7;
    transition:transform 0.1s, box-shadow 0.1s, background 0.2s;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .key:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #BDC3C7;}
  .key.used-correct{background:#EAFAF1;color:#1E8449;box-shadow:0 3px 0 #1E8449;cursor:default;}
  .key.used-wrong{background:#FADBD8;color:#C0392B;box-shadow:0 3px 0 #E74C3C;cursor:default;}
  .key:disabled{opacity:0.5;cursor:default;}

  /* WIN / LOSE overlay */
  .result-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .result-overlay.show { display:flex; }
  .result-card {
    background:white;
    border-radius:24px;
    padding:32px 28px;
    text-align:center;
    max-width:320px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    animation: slide-up 0.3s ease;
  }
  @keyframes slide-up {
    from{transform:translateY(40px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  .result-emoji { font-size:70px; margin-bottom:8px; }
  .result-title {
    font-family:'Fredoka One',cursive;
    font-size:32px;
    margin-bottom:6px;
  }
  .result-title.win { color:#27AE60; }
  .result-title.lose { color:#E74C3C; }
  .result-answer {
    font-size:14px;
    color:#7F8C8D;
    margin-bottom:4px;
  }
  .result-answer strong { color:#2C3E50; font-size:16px; }
  .result-score {
    font-size:13px;
    color:#95A5A6;
    margin-bottom:20px;
  }
  .result-btns { display:flex; flex-direction:column; gap:10px; }
  .play-again-btn {
    background:linear-gradient(135deg,#FF6B9D,#FF4757);
    color:white;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Fredoka One',cursive;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .change-cat-btn {
    background:#EBF5FB;
    color:#2C3E50;
    border:none;
    border-radius:14px;
    padding:12px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
  }

  /* Ground decoration */
  .ground-strip {
    width:100%;
    height:8px;
    background:#388E3C;
    position:fixed;
    bottom:0;
    left:0;
    z-index:0;
  }

  /* Responsive */
  @media(max-height:680px){
    .kangaroo-svg{width:80px;height:88px;}
    .kangaroo-area{min-height:95px;}
    .letter-box{width:25px;height:28px;font-size:15px;}
    .key{height:38px;font-size:14px;}
  }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen active">
  <div class="sun-decoration"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="game-logo">WordHop!</div>
  <div class="logo-sub">🦘 Guess the word before the kangaroo hops away!</div>
  <div class="kangaroo-home">🦘</div>
  <p style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);margin-bottom:2px;">Pick a Category or Play All!</p>
  <div class="category-grid">
    <button class="cat-btn words" onclick="startGame('words')">
      <span class="cat-icon">📝</span>
      <span class="cat-name">Words</span>
      <span class="cat-count">300 words</span>
    </button>
    <button class="cat-btn songs" onclick="startGame('songs')">
      <span class="cat-icon">🎵</span>
      <span class="cat-name">Song Titles</span>
      <span class="cat-count">300 songs</span>
    </button>
    <button class="cat-btn countries" onclick="startGame('countries')">
      <span class="cat-icon">🌍</span>
      <span class="cat-name">Countries</span>
      <span class="cat-count">200 countries</span>
    </button>
    <button class="cat-btn capitals" onclick="startGame('capitals')">
      <span class="cat-icon">🏛️</span>
      <span class="cat-name">Capital Cities</span>
      <span class="cat-count">200 capitals</span>
    </button>
    <button class="cat-btn cars" onclick="startGame('cars')">
      <span class="cat-icon">🚗</span>
      <span class="cat-name">Car Brands</span>
      <span class="cat-count">50+ brands</span>
    </button>
    <button class="cat-btn events" onclick="startGame('events')">
      <span class="cat-icon">📅</span>
      <span class="cat-name">World Events</span>
      <span class="cat-count">300 events</span>
    </button>
    <button class="cat-btn people" onclick="startGame('people')">
      <span class="cat-icon">⭐</span>
      <span class="cat-name">Famous People</span>
      <span class="cat-count">100 people</span>
    </button>
    <button class="cat-btn phrases" onclick="startGame('phrases')">
      <span class="cat-icon">💬</span>
      <span class="cat-name">Phrases</span>
      <span class="cat-count">300 phrases</span>
    </button>
  </div>
  <button class="start-all-btn" onclick="startGame('all')">🎲 RANDOM MIX!</button>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">← Menu</button>
    <span class="category-tag" id="cat-tag">Words</span>
    <div class="score-area">
      <div class="score-badge">🏆 <span id="score-display">0</span></div>
      <div class="score-badge">🔥 <span id="streak-display">0</span></div>
    </div>
  </div>

  <div class="kangaroo-area">
    <div class="kangaroo-scene">
      <svg class="kangaroo-svg" id="kang-svg" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
        <!-- Body -->
        <ellipse cx="50" cy="72" rx="26" ry="22" fill="#C8860A"/>
        <!-- Head -->
        <ellipse cx="68" cy="44" rx="18" ry="16" fill="#C8860A"/>
        <!-- Snout -->
        <ellipse cx="82" cy="50" rx="9" ry="7" fill="#E0A030"/>
        <!-- Nose -->
        <circle cx="88" cy="48" r="3" fill="#5D2E0C"/>
        <!-- Eye -->
        <circle cx="75" cy="40" r="3.5" fill="white"/>
        <circle cx="76" cy="40" r="2" fill="#2C1A0E"/>
        <circle cx="77" cy="39" r="0.7" fill="white"/>
        <!-- Ear -->
        <ellipse cx="60" cy="30" rx="5" ry="10" fill="#C8860A" transform="rotate(-15,60,30)"/>
        <ellipse cx="60" cy="31" rx="3" ry="7" fill="#E8A04A" transform="rotate(-15,60,31)"/>
        <!-- Arms -->
        <path d="M42 65 Q30 70 28 80" stroke="#C8860A" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M42 65 Q35 58 38 50" stroke="#C8860A" stroke-width="8" stroke-linecap="round" fill="none"/>
        <!-- Tail -->
        <path d="M26 80 Q10 90 14 105" stroke="#C8860A" stroke-width="10" stroke-linecap="round" fill="none"/>
        <!-- Legs -->
        <path d="M44 90 Q38 100 32 108" stroke="#A06808" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M54 92 Q52 102 48 109" stroke="#A06808" stroke-width="9" stroke-linecap="round" fill="none"/>
        <!-- Feet -->
        <ellipse cx="30" cy="108" rx="9" ry="4" fill="#8B5A00" transform="rotate(-20,30,108)"/>
        <ellipse cx="47" cy="109" rx="9" ry="4" fill="#8B5A00" transform="rotate(5,47,109)"/>
        <!-- Joey pouch hint -->
        <ellipse cx="44" cy="82" rx="10" ry="8" fill="#E09020" opacity="0.5"/>
        <!-- Pouch baby eyes -->
        <circle cx="42" cy="81" r="2" fill="#5D2E0C" id="joey-eye" opacity="0"/>
        <circle cx="47" cy="81" r="2" fill="#5D2E0C" opacity="0"/>
      </svg>
      <div class="speech-bubble" id="speech-bubble">Hop hop! Guess me!</div>
    </div>
  </div>

  <div class="lives-row" id="lives-row"></div>

  <div class="word-display-area">
    <div class="word-row" id="word-row"></div>
  </div>

  <div class="hint-section">
    <button class="hint-btn" id="hint-btn" onclick="useHint()">
      💡 Use Hint <span id="hints-left">(3 left)</span>
    </button>
    <div class="hint-text" id="hint-text" style="display:none;"></div>
  </div>

  <div class="wrong-letters-area" id="wrong-letters"></div>

  <div class="keyboard-area" id="keyboard-area"></div>
</div>

<!-- Result Overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-title" id="result-title">You Won!</div>
    <div class="result-answer" id="result-answer"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-btns">
      <button class="play-again-btn" onclick="playAgain()">▶ Play Again!</button>
      <button class="change-cat-btn" onclick="goHome()">← Change Category</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// WORD DATABASE
// ============================================================
const DB = {
  words: {
    label:"Words",
    hint_label:"This word means:",
    items:[
      {w:"ADVENTURE",h:"An exciting journey or experience"},
      {w:"BALLOON",h:"A colorful inflatable object"},
      {w:"BUTTERFLY",h:"A colorful flying insect"},
      {w:"CALENDAR",h:"Shows all the days of the year"},
      {w:"DIAMOND",h:"A very precious gemstone"},
      {w:"ELEPHANT",h:"The largest land animal"},
      {w:"FANTASY",h:"An imaginary or magical world"},
      {w:"GIRAFFE",h:"The tallest animal with a long neck"},
      {w:"HARMONY",h:"When things work well together"},
      {w:"INVENTOR",h:"Someone who creates new things"},
      {w:"JUNGLE",h:"A dense tropical forest"},
      {w:"KANGAROO",h:"An Australian marsupial that hops"},
      {w:"LANTERN",h:"A portable light source"},
      {w:"MOUNTAIN",h:"A very large hill made of rock"},

// Build "all" category
DB.all = {
  label:"Random Mix",
  hint_label:"Hint:",
  items: Object.values(DB).filter(v=>v.items).flatMap(v=>v.items)
};

// ============================================================
// GAME STATE
// ============================================================
const MAX_WRONG = 7;
let state = {
  category:'', word:'', hint:'',
  guessed:[], wrongGuesses:[], hintsLeft:3,
  hintRevealed:false, score:0, streak:0,
  usedIndices:[], gameOver:false
};

function pickWord(cat) {
  const pool = DB[cat].items;
  // Avoid repeats where possible
  if (state.usedIndices.length >= pool.length) state.usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (state.usedIndices.includes(idx));
  state.usedIndices.push(idx);
  return pool[idx];
}

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  showScreen('home');
  state.usedIndices = [];
  state.score = 0;
  state.streak = 0;
}

// ============================================================
// START GAME
// ============================================================
function startGame(cat) {
  state.category = cat;
  state.hintsLeft = 3;
  newRound();
  showScreen('game');
}

function newRound() {
  const item = pickWord(state.category);
  state.word = item.w.toUpperCase();
  state.hint = item.h;
  state.guessed = [];
  state.wrongGuesses = [];
  state.hintRevealed = false;
  state.gameOver = false;

  document.getElementById('cat-tag').textContent = DB[state.category].label;
  document.getElementById('score-display').textContent = state.score;
  document.getElementById('streak-display').textContent = state.streak;
  document.getElementById('hint-text').style.display='none';
  document.getElementById('hint-text').textContent='';
  document.getElementById('result-overlay').classList.remove('show');
  document.getElementById('speech-bubble').classList.remove('visible');

  const hintBtn = document.getElementById('hint-btn');
  hintBtn.disabled = state.hintsLeft === 0;
  document.getElementById('hints-left').textContent = `(${state.hintsLeft} left)`;

  renderLives();
  renderWord();
  renderWrongLetters();
  renderKeyboard();
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================
function renderLives() {
  const row = document.getElementById('lives-row');
  row.innerHTML = '';
  for (let i=0;i<MAX_WRONG;i++) {
    const h = document.createElement('div');
    h.className = 'life-heart' + (i >= (MAX_WRONG - state.wrongGuesses.length) ? ' lost' : '');
    h.textContent = '❤️';
    row.appendChild(h);
  }
}

function renderWord() {
  const row = document.getElementById('word-row');
  row.innerHTML = '';
  [...state.word].forEach(ch=>{
    const box = document.createElement('div');
    if (ch===' ') {
      box.className='letter-box space-gap';
    } else {
      box.className='letter-box' + (state.guessed.includes(ch) ? ' revealed' : '');
      box.textContent = state.guessed.includes(ch) ? ch : '';
    }
    row.appendChild(box);
  });
}

function renderWrongLetters() {
  const area = document.getElementById('wrong-letters');
  area.innerHTML = '';
  state.wrongGuesses.forEach(l=>{
    const chip = document.createElement('div');
    chip.className='wrong-letter-chip';
    chip.textContent=l;
    area.appendChild(chip);
  });
}

function renderKeyboard() {
  const rows=[
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M']
  ];
  const area = document.getElementById('keyboard-area');
  area.innerHTML='';
  rows.forEach(row=>{
    const rowDiv=document.createElement('div');
    rowDiv.className='key-row';
    row.forEach(letter=>{
      const btn=document.createElement('button');
      btn.className='key';
      btn.textContent=letter;
      btn.id='key-'+letter;
      const inWord=state.word.replace(/ /g,'').includes(letter);
      const guessed=state.guessed.includes(letter);
      const wrong=state.wrongGuesses.includes(letter);
      if(guessed){btn.classList.add('used-correct');btn.disabled=true;}
      else if(wrong){btn.classList.add('used-wrong');btn.disabled=true;}
      else{btn.onclick=()=>guess(letter);}
      rowDiv.appendChild(btn);
    });
    area.appendChild(rowDiv);
  });
}

// ============================================================
// GUESS LOGIC
// ============================================================
function guess(letter) {
  if (state.gameOver) return;
  letter = letter.toUpperCase();
  if (state.guessed.includes(letter) || state.wrongGuesses.includes(letter)) return;

  const btn = document.getElementById('key-'+letter);

  if (state.word.includes(letter)) {
    state.guessed.push(letter);
    btn.classList.add('used-correct');
    btn.disabled=true;
    renderWord();
    // Highlight newly revealed boxes
    const boxes=[...document.getElementById('word-row').children];
    [...state.word].forEach((ch,i)=>{ if(ch===letter) boxes[i].classList.add('revealed'); });
    checkWin();
  } else {
    state.wrongGuesses.push(letter);
    btn.classList.add('used-wrong');
    btn.disabled=true;
    renderLives();
    renderWrongLetters();
    showSpeechBubble(getSadQuip());
    checkLose();
  }
  btn.onclick=null;
}

function checkWin() {
  const letters=[...new Set(state.word.replace(/ /g,'').split(''))];
  if (letters.every(l=>state.guessed.includes(l))) {
    state.gameOver=true;
    state.score += 10 + (state.hintsLeft * 2) + Math.max(0,(MAX_WRONG-state.wrongGuesses.length)*3);
    state.streak++;
    setTimeout(()=>showResult(true),700);
  }
}

function checkLose() {
  if (state.wrongGuesses.length >= MAX_WRONG) {
    state.gameOver=true;
    state.streak=0;
    setTimeout(()=>showResult(false),600);
  }
}

// ============================================================
// HINT
// ============================================================
function useHint() {
  if (state.hintsLeft<=0) return;
  state.hintsLeft--;
  state.hintRevealed=true;
  document.getElementById('hints-left').textContent=`(${state.hintsLeft} left)`;
  if (state.hintsLeft===0) document.getElementById('hint-btn').disabled=true;
  const hintArea=document.getElementById('hint-text');
  hintArea.textContent=`💡 ${DB[state.category].hint_label || 'Hint:'} ${state.hint}`;
  hintArea.style.display='block';
}

// ============================================================
// SPEECH BUBBLE
// ============================================================
const sadQuips=["Oops!","Not that one!","Try again!","Hmm...","Close!","Nope!","Uh oh!"];
function getSadQuip(){return sadQuips[Math.floor(Math.random()*sadQuips.length)];}
let bubbleTimer;
function showSpeechBubble(msg){
  const b=document.getElementById('speech-bubble');
  b.textContent=msg; b.classList.add('visible');
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>b.classList.remove('visible'),1500);
}

// ============================================================
// RESULT OVERLAY
// ============================================================
function showResult(won) {
  const overlay=document.getElementById('result-overlay');
  document.getElementById('result-emoji').textContent=won?'🎉':'😢';
  const title=document.getElementById('result-title');
  title.textContent=won?'You Got It!':'Oh No!';
  title.className='result-title '+(won?'win':'lose');
  document.getElementById('result-answer').innerHTML=won
    ?`<strong>Brilliant! The answer was "${state.word}"</strong>`
    :`The answer was: <strong>${state.word}</strong>`;
  document.getElementById('result-score').textContent=
    won?`+${state.score} points total | Streak: ${state.streak} 🔥`
       :`Score: ${state.score} | Streak reset`;
  overlay.classList.add('show');
}

function playAgain() {
  document.getElementById('result-overlay').classList.remove('show');
  newRound();
}

// ============================================================
// KEYBOARD INPUT
// ============================================================
document.addEventListener('keydown',(e)=>{
  if (document.getElementById('game').classList.contains('active')) {
    const letter=e.key.toUpperCase();
    if (/^[A-Z]$/.test(letter)) guess(letter);
  }
});
</script>
